# EDUCORE — development stack. `make up` starts it (copies .env.example → .env when missing).
# Host ports are configurable (ADR-014); databases are published only for local debugging.

x-app: &app
  build:
    context: .
    target: final
    args:
      INSTALL_DEV: "1"
  image: educore:dev
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
  volumes:
    - .:/app
    - media:/data/media
    - private:/data/private
    - telegram_session:/data/telegram
    - fastembed_cache:/app/.cache/fastembed
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  healthcheck:
    disable: true

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educore}
      POSTGRES_USER: ${POSTGRES_USER:-educore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educore}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    ports:
      - "127.0.0.1:${EDUCORE_DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${EDUCORE_MAILPIT_PORT:-8125}:8025"
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_all"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_POOL: "true"
    ports:
      - "127.0.0.1:${EDUCORE_WEB_PORT:-8100}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz | grep -q '\"ok\"'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "ingest,default", "-c", "2", "-Ofair", "-n", "worker@%h",
              "--loglevel", "INFO"]

  worker-ai:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "ai", "-c", "1", "-Ofair", "-n", "worker-ai@%h",
              "--loglevel", "INFO"]

  worker-media:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "media", "-c", "1", "-n", "worker-media@%h",
              "--loglevel", "INFO"]

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-S", "django_celery_beat.schedulers:DatabaseScheduler",
              "--loglevel", "INFO"]

  ingestor:
    <<: *app
    profiles: ["telegram"]
    command: ["python", "manage.py", "telegram_ingest"]

  tailwind:
    <<: *app
    profiles: ["ui"]
    command: ["python", "manage.py", "tailwind", "watch"]
    restart: "no"

  flower:
    <<: *app
    profiles: ["ops"]
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:${EDUCORE_FLOWER_PORT:-5655}:5555"

volumes:
  pgdata:
  redisdata:
  media:
  private:
  telegram_session:
  fastembed_cache:
