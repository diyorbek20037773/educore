{% load i18n web_tags %}
<div class="lightbox" x-show="open" x-cloak x-on:keydown.escape.window="hide" x-on:click.self="hide" role="dialog" aria-modal="true" aria-label="{% translate 'Rasm' %}">
  <img x-bind:src="src" alt="" class="max-h-[90vh] max-w-[92vw] rounded-lg">
  <button type="button" class="icon-btn absolute right-4 top-4 bg-white/90 text-ink" x-on:click="hide" aria-label="{% translate 'Yopish' %}">{% icon "x" "size-5" %}</button>
</div>
