{# field: a bound form field; errors linked with aria-describedby #}
<div class="form-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.name }}-help" class="mt-1 text-xs text-ink-2">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p id="{{ field.name }}-error" class="field-error">{{ field.errors|join:" " }}</p>{% endif %}
</div>
