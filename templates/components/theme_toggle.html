{% load i18n web_tags %}{# fab: floating round button (>= 1280 px); row: full-width row inside the mobile menu; default: header icon #}
<button type="button" class="{% if fab %}fab{% elif row %}drawer-toggle{% else %}icon-btn{% endif %}" x-data="themeToggle" x-on:click="toggle" x-bind:aria-pressed="pressed"
        aria-label="{% translate 'Yorugʻ yoki qorongʻi rejim' %}">
  <span x-show="isDark" x-cloak>{% icon "sun" "size-5" %}</span>
  <span x-show="isLight">{% icon "moon" "size-5" %}</span>
  {% if row %}<span aria-hidden="true">{% translate "Yorugʻ yoki qorongʻi rejim" %}</span>{% endif %}
</button>
