{% load i18n web_tags %}
<button type="button" class="{% if fab %}fab{% else %}icon-btn{% endif %}" x-data="themeToggle" x-on:click="toggle" x-bind:aria-pressed="pressed"
        aria-label="{% translate 'Yorugʻ yoki qorongʻi rejim' %}">
  <span x-show="isDark" x-cloak>{% icon "sun" "size-5" %}</span>
  <span x-show="isLight">{% icon "moon" "size-5" %}</span>
</button>
