{% load web_tags %}
<article class="card card-link relative flex h-full flex-col p-5">
  <span class="grid size-11 place-items-center rounded-lg bg-surface-2 text-brand">{% icon profession.icon "size-5" %}</span>
  <h3 class="mt-3 font-sans text-base font-bold"><a href="{{ profession.get_absolute_url }}" class="after:absolute after:inset-0">{{ profession.name }}</a></h3>
  <p class="mt-2 text-sm text-ink-2 line-clamp-3">{{ profession.summary }}</p>
  <div class="mt-auto flex gap-1.5 pt-4" aria-label="{{ profession.institutions.all|join:', ' }}">
    {% for inst in profession.institutions.all %}<span class="inst-dot inst-{{ inst.order }}" title="{{ inst.short_name }}"></span>{% endfor %}
  </div>
</article>
